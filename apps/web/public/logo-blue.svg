<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <style>
      .logo-text { font-family: Arial, sans-serif; font-weight: bold; }
      .logo-circle { fill: #1F6AA2; }
      .logo-accent { fill: #41A857; }
    </style>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="white" stroke="#1F6AA2" stroke-width="2"/>
  
  <!-- Main circle design -->
  <circle cx="100" cy="60" r="30" class="logo-circle" opacity="0.2"/>
  <circle cx="100" cy="60" r="25" fill="none" stroke="#1F6AA2" stroke-width="2"/>
  
  <!-- Book/Document symbol -->
  <g transform="translate(100, 60)">
    <!-- Left page -->
    <path d="M -8 -8 L -8 8 Q 0 10 0 8 L 0 -8 Z" fill="#1F6AA2"/>
    <!-- Right page -->
    <path d="M 8 -8 L 8 8 Q 0 10 0 8 L 0 -8 Z" fill="#41A857"/>
    <!-- Line accent -->
    <line x1="-5" y1="0" x2="5" y2="0" stroke="white" stroke-width="1.5" opacity="0.7"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="125" text-anchor="middle" class="logo-text" font-size="16" fill="#1F6AA2">PPDT</text>
  <text x="100" y="145" text-anchor="middle" font-size="10" fill="#41A857" font-weight="normal">Ararendá</text>
</svg>
